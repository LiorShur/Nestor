<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CareCall — Carer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<script>
/* ══════════════════════════════════════════════
   CONFIGURATION — edit ONE line
   Same IP as in patient.html
   ══════════════════════════════════════════════ */
const SERVER_IP = '192.168.1.23';
/* ══════════════════════════════════════════════ */
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; height: -webkit-fill-available; }
body {
  height: 100%; min-height: -webkit-fill-available;
  overflow: hidden; -webkit-font-smoothing: antialiased;
  font-family: 'Outfit', sans-serif;
  background: #0E1621; color: #F0F6FF;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative;
  background-image: radial-gradient(ellipse at 50% 40%, rgba(34,211,238,0.07) 0%, transparent 65%);
  transition: background-image .6s;
}
body.alerting {
  background-image: radial-gradient(ellipse at 50% 40%, rgba(248,113,113,0.13) 0%, transparent 55%);
}

/* ── Wordmark ── */
.wordmark { position:absolute; top:32px; font-family:'Fraunces',serif; font-size:1rem; font-weight:300; color:#4B6080; letter-spacing:1.5px; }
.wordmark em { color:#22D3EE; font-style:normal; }

/* ── Splash ── */
#splash {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
  background: #0E1621;
  transition: opacity 0.4s;
}
#splash.gone { opacity: 0; pointer-events: none; }
.splash-logo { font-family: 'Fraunces', serif; font-size: 2.8rem; font-weight: 600; color: #F0F6FF; }
.splash-logo em { color: #22D3EE; font-style: normal; }
.splash-role { font-size: 0.78rem; letter-spacing: 3px; text-transform: uppercase; color: #22D3EE; margin-top: -20px; }
.splash-btn {
  width: 170px; height: 170px; border-radius: 50%; border: 2px solid rgba(34,211,238,0.35);
  background: #0E4D6E; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 12px 50px rgba(34,211,238,0.2);
  animation: sbreathe 3s ease-in-out infinite;
  -webkit-tap-highlight-color: transparent;
  font-family: 'Outfit', sans-serif;
  transition: transform .15s cubic-bezier(.34,1.56,.64,1);
}
.splash-btn:active { transform: scale(0.93); }
@keyframes sbreathe {
  0%,100%{box-shadow:0 12px 50px rgba(34,211,238,0.2)}
  50%{box-shadow:0 16px 60px rgba(34,211,238,0.38)}
}
.splash-icon  { font-size: 4rem; line-height: 1; }
.splash-label { font-size: .72rem; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,.8); }
.splash-hint  { font-size: .78rem; color: #4B6080; }

/* ── Standby orb ── */
.standby { display:flex; flex-direction:column; align-items:center; gap:28px; position:relative; z-index:1; }

.orb-wrap { position:relative; width:180px; height:180px; display:flex; align-items:center; justify-content:center; }
.orb-ring { position:absolute; inset:-18px; border-radius:50%; border:1px solid rgba(34,211,238,0.2); animation:orbit 5s ease-in-out infinite; }
.orb-ring-2 { inset:-32px; border-color:rgba(34,211,238,0.1); animation-delay:1s; }
@keyframes orbit { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.05);opacity:.25} }

.orb {
  width:140px; height:140px; border-radius:50%;
  background:rgba(34,211,238,0.12); border:1.5px solid rgba(34,211,238,0.3);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  transition:all .5s;
}
.orb-icon  { font-size:2.8rem; line-height:1; }
.orb-label { font-size:.65rem; letter-spacing:3.5px; text-transform:uppercase; color:#22D3EE; font-weight:700; }

.dots { display:flex; gap:7px; align-items:center; }
.dot  { width:5px; height:5px; border-radius:50%; background:#4B6080; animation:wave 1.6s ease-in-out infinite; }
.dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
@keyframes wave { 0%,60%,100%{transform:scaleY(1);opacity:.4} 30%{transform:scaleY(2.2);opacity:1} }

.status-txt { font-size:.85rem; color:#4B6080; letter-spacing:.5px; transition:color .3s; }
.status-txt.live { color:rgba(34,211,238,.75); }

/* ── Incoming call overlay ── */
.alert {
  position: absolute; inset: 0;
  background: rgba(10,14,20,0.97);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  z-index: 10; padding: 40px 28px;
}
.alert.show { display: flex; }
.alert-flash { position:absolute; inset:0; animation:flash .7s ease-in-out infinite alternate; pointer-events:none; }
@keyframes flash { from{background:transparent} to{background:rgba(248,113,113,0.06)} }
.bell { font-size:5.5rem; filter:drop-shadow(0 0 24px rgba(248,113,113,0.5)); animation:swing .4s ease-in-out infinite alternate; line-height:1; }
@keyframes swing { from{transform:rotate(-25deg) scale(1)} to{transform:rotate(25deg) scale(1.05)} }
.alert-title { font-family:'Fraunces',serif; font-size:3.2rem; font-weight:700; color:#F87171; text-align:center; line-height:1.05; letter-spacing:-1px; }
.alert-sub   { color:#7A9BB5; font-size:.9rem; text-align:center; max-width:260px; line-height:1.5; }
.ack-btn {
  margin-top:8px; background:#34D399; color:#0D2018;
  border:none; border-radius:100px; padding:22px 44px;
  font-family:'Outfit',sans-serif; font-size:1.15rem; font-weight:700;
  cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .12s;
  box-shadow:0 6px 30px rgba(52,211,153,0.3);
}
.ack-btn:active { transform:scale(0.96); }

/* ── Toast ── */
.toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(80px);
  background:rgba(30,45,60,.95); color:#94A3B8;
  border-radius:14px; padding:12px 22px; font-size:.84rem;
  white-space:nowrap; z-index:400; transition:transform .3s cubic-bezier(.4,0,.2,1);
  pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="splash-logo">Care<em>Call</em></div>
  <div class="splash-role">Carer</div>
  <button class="splash-btn" onclick="startApp()">
    <div class="splash-icon">🔔</div>
    <div class="splash-label">Tap to Start</div>
  </button>
  <div class="splash-hint">Both phones must be on the same WiFi</div>
</div>

<!-- Standby UI -->
<div class="wordmark">Care<em>Call</em></div>
<div class="standby">
  <div class="orb-wrap">
    <div class="orb-ring"></div>
    <div class="orb-ring orb-ring-2"></div>
    <div class="orb" id="orb">
      <div class="orb-icon" id="orb-icon">🔔</div>
      <div class="orb-label" id="orb-label">Standby</div>
    </div>
  </div>
  <div class="dots" id="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="status-txt" id="status">Starting up…</div>
</div>

<!-- Incoming call overlay -->
<div class="alert" id="alert">
  <div class="alert-flash"></div>
  <div class="bell">🔔</div>
  <div class="alert-title">Patient<br>Calling!</div>
  <div class="alert-sub">Your patient needs you right now</div>
  <button class="ack-btn" onclick="acknowledge()">✓ &nbsp;I'm on my way</button>
</div>

<div class="toast" id="toast"></div>

<script>
const WS_URL = 'ws://' + SERVER_IP + ':8765';
let ws          = null;
let started     = false;
let reconnTimer = null;
let bellTimer   = null;
let audioCtx    = null;

// ── UI helpers ─────────────────────────────────
function setStatus(state, msg) {
  const orb   = document.getElementById('orb');
  const icon  = document.getElementById('orb-icon');
  const label = document.getElementById('orb-label');
  const stat  = document.getElementById('status');
  const dots  = document.getElementById('dots');
  stat.textContent = msg; stat.className = 'status-txt';
  if (state==='starting')  { orb.style.cssText=''; icon.textContent='🔔'; label.textContent='Standby'; dots.style.display='flex'; }
  if (state==='listening') { orb.style.cssText='border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.08)'; icon.textContent='🔔'; label.textContent='Ready'; dots.style.display='none'; stat.classList.add('live'); }
  if (state==='connected') { orb.style.cssText='border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08)'; icon.textContent='🟢'; label.textContent='On Call'; dots.style.display='none'; stat.classList.add('live'); }
}
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),3000);
}

// ── Audio / bell ───────────────────────────────
function unlockAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const b=audioCtx.createBuffer(1,1,22050),s=audioCtx.createBufferSource();
    s.buffer=b; s.connect(audioCtx.destination); s.start();
  } catch(e){}
}
function playBell() {
  try {
    if (!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==='suspended') audioCtx.resume();
    const ctx=audioCtx, t=ctx.currentTime;
    [[880,.75],[1760,.38],[2640,.2],[3520,.1],[4400,.05]].forEach(([f,g])=>{
      const o=ctx.createOscillator(),gn=ctx.createGain();
      o.connect(gn); gn.connect(ctx.destination);
      o.frequency.value=f;
      gn.gain.setValueAtTime(g,t);
      gn.gain.exponentialRampToValueAtTime(0.0001,t+3.2);
      o.start(t); o.stop(t+3.2);
    });
    if (navigator.vibrate) navigator.vibrate([500,150,500,150,800]);
  } catch(e){}
}
function startBell() { playBell(); bellTimer=setInterval(playBell,3400); }
function stopBell()  { clearInterval(bellTimer); bellTimer=null; }

// ── Alert ──────────────────────────────────────
function showAlert() {
  document.getElementById('alert').classList.add('show');
  document.body.classList.add('alerting');
  startBell();
}
function hideAlert() {
  document.getElementById('alert').classList.remove('show');
  document.body.classList.remove('alerting');
  stopBell();
}
function acknowledge() {
  stopBell(); hideAlert();
  if (ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type:'ack'}));
  toast("Patient notified — you're on the way!");
}
window.acknowledge = acknowledge;

// ── WebSocket ──────────────────────────────────
function connect() {
  clearTimeout(reconnTimer);
  if (ws) { try { ws.close(); } catch(e){} ws=null; }
  setStatus('starting', 'Connecting…');

  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    ws.send(JSON.stringify({ role: 'carer' }));
    setStatus('listening', 'Waiting for patient…');
  };

  ws.onmessage = (evt) => {
    let d;
    try { d=JSON.parse(evt.data); } catch(e){ return; }

    if (d.type==='peer-online') {
      setStatus('connected', 'Patient connected');
      toast('Patient connected ✓');
    }
    if (d.type==='peer-offline') {
      setStatus('listening', 'Waiting for patient…');
      hideAlert();
      toast('Patient disconnected');
    }
    if (d.type==='call') showAlert();
  };

  ws.onclose = () => {
    setStatus('starting', 'Reconnecting…');
    hideAlert();
    reconnTimer = setTimeout(connect, 1000);
  };

  ws.onerror = () => {
    // onclose fires right after
  };
}

// ── Start ──────────────────────────────────────
function startApp() {
  unlockAudio();
  document.getElementById('splash').classList.add('gone');
  started = true;
  connect();
}

// ── Wake / network listeners ───────────────────
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState==='visible' && started) {
    clearTimeout(reconnTimer); connect();
  }
});
window.addEventListener('online', () => {
  if (started) { clearTimeout(reconnTimer); reconnTimer=setTimeout(connect, 800); }
});
</script>
</body>
</html>
